<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>
        Sistema de Créditos
    </title>

    <link rel="stylesheet"
        href="simulador_completo.css">
</head>

<body>

    <header>
        <h1>
            Sistema Básico de Créditos
        </h1>
    </header>


    <!-- MENU -->
    <nav>

        <button onclick="mostrarSeccion('parametros')">
            Parámetros
        </button>

        <button onclick="mostrarSeccion('clientes')">
            Clientes
        </button>

        <button onclick="mostrarSeccion('credito')">
            Créditos
        </button>

    </nav>


    <!-- PARAMETROS -->
    <section id="parametros">

        <h2>
            Configurar Parámetros
        </h2>

        <label>
            Tasa de interés:
        </label>

        <input type="number"
            id="tasaInteres">

        <span>%</span>

        <br><br>

        <button onclick="guardarTasa()">
            Guardar tasa
        </button>

        <p id="mensajeTasa"></p>

    </section>


    <!-- CLIENTES -->
    <section id="clientes">

        <h2>
            Registro de Clientes
        </h2>

        <input type="text"
            id="cedula"
            placeholder="Cédula">

        <input type="text"
            id="nombre"
            placeholder="Nombre">

        <input type="text"
            id="apellidos"
            placeholder="Apellido">

        <input type="number"
            id="ingresos"
            placeholder="Ingresos">

        <input type="number"
            id="egresos"
            placeholder="Egresos">

        <br><br>

        <button onclick="guardarCliente()">
            Guardar Cliente
        </button>

        <button onclick="limpiarFormularioCliente()">
            Limpiar
        </button>

        <br><br>

        <table border="1">

            <thead>

                <tr>

                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Ingresos</th>
                    <th>Egresos</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tablaClientes">

            </tbody>

        </table>

    </section>


    <!-- CREDITOS -->
    <section id="credito">

        <h2>
            Solicitar Crédito
        </h2>

        <input type="text"
            id="buscarCedulaCredito"
            placeholder="Ingrese cédula">

        <button onclick="buscarClienteCredito()">
            Buscar Cliente
        </button>

        <br><br>

        <div id="datosClienteCredito"
            class="card">

        </div>

        <br>

        <input type="number"
            id="montoCredito"
            placeholder="Monto del crédito">

        <br>

        <small class="hint">
            Monto de crédito
        </small>

        <br><br>

        <input type="number"
            id="plazoCredito"
            placeholder="Plazo">

        <br>

        <small class="hint">
            Plazo del crédito
        </small>

        <br><br>

        <button onclick="calcularCredito()">
            Calcular Crédito
        </button>

        <br><br>

        <div id="resultadoCredito">

        </div>

        <br>

        <button id="btnSolicitarCredito"
            onclick="asignarCredito()"
            disabled>

            Solicitar Crédito

        </button>


        <hr>


        <!-- LISTADO CREDITOS -->
        <h2>
            Listado de Créditos
        </h2>

        <input type="text"
            id="buscarCedulaListado"
            placeholder="Buscar por cédula">

        <button onclick="buscarCreditosCliente()">
            Buscar Créditos
        </button>

        <button onclick="mostrarTodosCreditos()">
            Mostrar Todos
        </button>

        <br><br>

        <table border="1">

            <thead>

                <tr>

                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Monto</th>
                    <th>Tasa</th>
                    <th>Plazo</th>
                    <th>Cuota</th>

                </tr>

            </thead>

            <tbody id="tablaCreditos">

            </tbody>

        </table>

    </section>


    <!-- SCRIPTS -->
    <script src="utilitarios.js"></script>

    <script src="simulador_completo.js"></script>

</body>

</html>
